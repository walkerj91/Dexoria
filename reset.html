<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <style>
        body {
            font-family: 'Radjhani', sans-serif;
            background: #6F2DA8;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .reset-container {
            background: #562382;
            padding: 30px;
            border-radius: 10px;
            width: 350px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: none;
            outline: none;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #ffd700;
            border: none;
            border-radius: 6px;
            color: black;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease; /* Smooths the 3D transition */
            box-shadow: 0 4px 0 #b38f00; /* Darker yellow "bottom" for 3D look */
        }

        button:hover {
            background: #ffd700;
            transform: translateY(-2px); /* Lifts the button up */
            box-shadow: 0 6px 0 #b38f00; /* Increase shadow to enhance lifted effect */
        }

        
    </style>
</head>
<body>

<div class="reset-container">
    <h2>Reset Your Password</h2>

    <input type="email" id="email" placeholder="Enter your account email">

    <button id="resetBtn">Send Reset Link</button>
</div>

<script type="module">
    import { supabase } from 'supabaseClient.js';

    document.getElementById("resetBtn").addEventListener("click", async () => {
        const email = document.getElementById("email").value.trim();

        if (!email) {
            alert("Please enter your email.");
            return;
        }

        const { error } = await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: "http://localhost:5500/reset.html"
        });

        if (error) {
            alert("Error sending reset email: " + error.message);
            return;
        }

        // Replace the form with a confirmation message
        document.querySelector(".reset-container").innerHTML = `
            <h2>Check Your Email</h2>
            <p>A password reset link has been sent to:</p>
            <p style="font-weight:bold; margin-top:10px;">${email}</p>
            <p style="margin-top:20px;">Follow the instructions in the email to reset your password.</p>
            <button onclick="window.location.href='login.html'">Back to Login</button>
        `;
    });
</script>


</body>
</html>
